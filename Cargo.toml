[workspace]
resolver = "2"
members = ["crates/pearl-ref", "crates/pearl-gpu", "crates/pearl-net", "crates/pearl-miner"]
exclude = ["pearl", "spark-pearl-miner"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
homepage = "https://github.com/pearl-research-labs/pearl"
repository = "https://github.com/pearl-research-labs/pearl"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky2"]
categories = ["cryptography"]

[workspace.lints.clippy]
too_long_first_doc_paragraph = "allow"

[workspace.dependencies]
ahash = { version = "0.8.7", default-features = false, features = ["compile-time-rng"] }
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
bincode = "1.3"
blake3 = "1.8"
flate2 = "1"
hex = "0.4"
hkdf = "0.12"
pearl-blake3 = { path = "pearl/pearl-blake3", features = ["serde"] }
primitive-types = { version = "0.12", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
zk-pow = { path = "pearl/zk-pow" }
hashbrown = { version = "0.14.3", default-features = false, features = ["ahash", "serde"] }
itertools = { version = "0.11.0", default-features = false }
log = { version = "0.4.14", default-features = false }
num = { version = "0.4", default-features = false, features = ["rand"] }
rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
static_assertions = { version = "1.1.0", default-features = false }
unroll = { version = "0.1.5", default-features = false }
